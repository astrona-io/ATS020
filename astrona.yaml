training:
  id: ATS020
  title: 'CNPE: Observability and Operations'
  description: |
    Training material covering the Certified Cloud Native Platform Engineer (CNPE) Observability and Operations domain: scraping workloads with Prometheus, PromQL, alerting rules and Alertmanager routing, Grafana dashboards, log collection with the OpenTelemetry Collector, distributed tracing with OpenTelemetry and Jaeger, DORA delivery metrics, service level objectives and resource efficiency, and diagnosing and fixing broken workloads and platform components. Each module pairs a layered reader with an ungraded hands-on playground. Each section closes with an integration capstone. Built and verified against Kubernetes 1.35.
  certification:
    name: Certified Cloud Native Platform Engineer
    code: CNPE
    provider: CNCF / Linux Foundation
    domain: Observability and Operations
    weight: 20
    competencies:
    - Implementing Monitoring, Alerting, Logging, and Tracing Solutions
    - Measuring and Improving Platform Efficiency Using Deployment Metrics and Performance Indicators
    - Diagnosing and Remediating Platform Issue and Incident Scenarios
modules:
- id: module-intro
  title: Introduction
  description: |
    Start here. What this course trains you to do, how it is laid out, how to get your machine ready with the astrona command-line tool, how the content is written and checked, who maintains it, and how to report a mistake.
  content:
  - type: reading
    title: Introduction
    path: sections/intro/00-introduction.md
  - type: reading
    title: Welcome To The Course
    path: sections/intro/10-welcome.md
  - type: reading
    title: Get Your Machine Ready
    path: sections/intro/20-get-your-machine-ready.md
  - type: reading
    title: How This Course Is Made
    path: sections/intro/30-how-this-course-is-made.md
- id: module-010
  title: Metrics And Alerting With Prometheus
  description: |
    Makes the reader able to get any workload's metrics into Prometheus through the Prometheus Operator or raw scrape configuration, query them with PromQL, and turn a query into an alert that reaches a receiver. It comes first because every later section (dashboards, SLOs, DORA metrics, incident triage) reads these metrics.
