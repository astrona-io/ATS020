# Course manifest for ATS020 - Observability and Operations (Certified Cloud Native Platform Engineer).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS020
  title: "CNPE: Observability and Operations"
  description: >
    Training material covering the Certified Cloud Native Platform Engineer
    (CNPE) Observability and Operations domain: scraping workloads with
    Prometheus, PromQL, alerting rules and Alertmanager routing, Grafana
    dashboards, log collection with the OpenTelemetry Collector,
    distributed tracing with OpenTelemetry and Jaeger, DORA delivery metrics,
    service level objectives and resource efficiency, and diagnosing and
    fixing broken workloads and platform components. Each module pairs a
    layered reader with an ungraded hands-on playground. Each section closes
    with an integration capstone.
    Built and verified against Kubernetes 1.35.

  certification:
    name: Certified Cloud Native Platform Engineer
    code: CNPE
    provider: CNCF / Linux Foundation
    domain: Observability and Operations
    weight: 20
    competencies:
      - "Implementing Monitoring, Alerting, Logging, and Tracing Solutions"
      - "Measuring and Improving Platform Efficiency Using Deployment Metrics and Performance Indicators"
      - "Diagnosing and Remediating Platform Issue and Incident Scenarios"

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

