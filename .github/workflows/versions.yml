# Fails a pull request when a course file holds a version that differs from
# versions.env. Fix it with: scripts/sync-versions.py
name: versions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check that the course files match versions.env
        run: python3 scripts/sync-versions.py --check
