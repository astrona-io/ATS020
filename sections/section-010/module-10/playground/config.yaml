# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Scrape Workloads With ServiceMonitor And PodMonitor (PLAYGROUND).
# A clean sandbox: it starts, installs a trimmed Prometheus stack and the
# Starfleet workloads, then stays running for free exploration. No task, no
# grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-020-playground-010-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - quay.io/prometheus-operator/prometheus-operator:v0.94.1
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
      - quay.io/prometheus/prometheus:v3.15.0-distroless
      - ghcr.io/jkroepke/kube-webhook-certgen:1.8.9
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: prepare
      description: "Install Helm if missing and a trimmed kube-prometheus-stack 92.3.0 (Prometheus Operator and one Prometheus) in `monitoring`"
      type: file
      source: bootstrap/prepare.sh
  manifests:
    - name: lab-start
      description: "Namespaces starfleet and outpost, the scout workloads and the shuttle client"
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/scout
      namespace: outpost
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
