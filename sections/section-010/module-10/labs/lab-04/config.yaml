# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-020-lab-010-01-04
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - quay.io/prometheus-operator/prometheus-operator:v0.94.1
    - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
    - quay.io/prometheus/prometheus:v3.15.0-distroless
    - ghcr.io/jkroepke/kube-webhook-certgen:1.8.9
    - ghcr.io/stefanprodan/podinfo:6.17.0
bootstrap:
  init:
  - name: prepare
    description: Install a trimmed kube-prometheus-stack 93.3.0 (Prometheus Operator and one Prometheus) in monitoring
    type: file
    source: bootstrap/01-prepare.sh
  manifests:
  - name: lab-start
    description: Starting resources for scrape pods with a podmonitor
    type: file
    source: manifests/lab-start.yaml
  waitFor:
  - resource: deploy/scout
    namespace: outpost
testing:
  init:
  - name: verify-start
    description: Verify the intended starting fault and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: solution
    description: Reference solution applied by `astrona test`
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: pod-targets
    description: Every ready scout Pod is scraped through its PodMonitor
    type: file
    source: validation/validate-pod-targets.sh
teardown:
  keepCluster: false
