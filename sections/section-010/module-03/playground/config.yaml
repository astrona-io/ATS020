# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Alert With PrometheusRule And Alertmanager (PLAYGROUND).
# A clean sandbox: it starts, installs a trimmed Prometheus stack with
# Alertmanager, the Starfleet workloads and a webhook receiver, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-020-playground-010-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - quay.io/prometheus-operator/prometheus-operator:v0.94.1
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
      - quay.io/prometheus/prometheus:v3.15.0-distroless
      - quay.io/prometheus/alertmanager:v0.34.1
      - ghcr.io/jkroepke/kube-webhook-certgen:1.8.9
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0
      - python:3.13-alpine

bootstrap:
  init:
    - name: prepare
      description: "Install Helm if missing and a trimmed kube-prometheus-stack 92.3.0 (Prometheus Operator, one Prometheus, one Alertmanager) in `monitoring`"
      type: file
      source: bootstrap/prepare.sh
  manifests:
    - name: lab-start
      description: "scout with its ServiceMonitor, the shuttle traffic loop, and the alert-receiver webhook"
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/alert-receiver
      namespace: monitoring

teardown:
  keepCluster: false
