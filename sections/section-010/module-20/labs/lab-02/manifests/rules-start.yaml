apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scout-queries
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
  - name: scout-queries
    rules:
    - record: scout:error_ratio:rate5m
      expr: sum(rate(http_requests_total{namespace="starfleet",status=~"5.."}[5m])) / sum(http_requests_total{namespace="starfleet"})
    - record: scout:request_duration_seconds:p95_5m
      expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="starfleet"}[5m])))
