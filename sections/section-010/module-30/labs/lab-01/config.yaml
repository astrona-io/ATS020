# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-020-lab-010-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
    examQuestion: question.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - quay.io/prometheus-operator/prometheus-operator:v0.94.1
    - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
    - quay.io/prometheus/prometheus:v3.15.0-distroless
    - quay.io/prometheus/alertmanager:v0.34.1
    - ghcr.io/jkroepke/kube-webhook-certgen:1.8.9
    - ghcr.io/stefanprodan/podinfo:6.17.0
    - curlimages/curl:8.22.0
    - python:3.13.18-alpine3.24
bootstrap:
  init:
  - name: prepare
    description: Install the monitoring stack and terminal prerequisites
    type: file
    source: bootstrap/01-prepare.sh
  - name: seed
    description: Deploy workloads and wait for ProbeMaintenance
    type: file
    source: bootstrap/02-seed.sh
  waitFor:
  - resource: deploy/scout
    namespace: starfleet
  - resource: deploy/shuttle
    namespace: starfleet
  - resource: deploy/alert-receiver
    namespace: monitoring
testing:
  init:
  - name: solution
    type: file
    source: solution/apply.sh
  - name: wait-for-alert
    type: file
    source: testing/wait-for-alert.sh
validation:
  scripts:
  - name: rule-loaded
    description: The selected rule uses the requested metric, threshold, duration
      and labels
    type: file
    source: validation/validate-rule-loaded.sh
  - name: alert-firing
    description: ScoutErrorRate fires for starfleet
    type: file
    source: validation/validate-alert-firing.sh
  - name: receiver-routed
    description: Alertmanager assigns the alert to the webhook and the receiver logs
      it
    type: file
    source: validation/validate-receiver-routed.sh
  - name: maintenance-silenced
    description: An active scoped 30-minute silence suppresses the maintenance alert
    type: file
    source: validation/validate-maintenance-silenced.sh
teardown:
  keepCluster: false
