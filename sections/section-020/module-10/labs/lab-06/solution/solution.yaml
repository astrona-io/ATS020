apiVersion: v1
kind: ConfigMap
metadata:
  name: datasource-prometheus
  namespace: monitoring
  labels:
    grafana_datasource: '1'
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://kps-prometheus.monitoring:9090
        isDefault: true
        jsonData:
          timeInterval: 15s
