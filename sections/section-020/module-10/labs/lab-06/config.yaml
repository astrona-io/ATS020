# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-020-lab-020-01-06
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - quay.io/prometheus-operator/prometheus-operator:v0.94.1
    - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
    - quay.io/prometheus/prometheus:v3.15.0-distroless
    - ghcr.io/jkroepke/kube-webhook-certgen:1.8.9
    - docker.io/grafana/grafana:13.2.3-distroless
    - quay.io/kiwigrid/k8s-sidecar:2.14.1
    - ghcr.io/stefanprodan/podinfo:6.17.0
    - curlimages/curl:8.23.0
bootstrap:
  init:
  - name: install-stack
    description: Install a trimmed kube-prometheus-stack 92.22.0 (Prometheus Operator, one Prometheus and Grafana
      13.2.3) in `monitoring`
    type: file
    source: bootstrap/01-install-stack.sh
  manifests:
  - name: lab-start
    description: Starting resources for provision the prometheus data source
    type: file
    source: manifests/lab-start.yaml
  - name: dashboard-start
    description: Starting resources for provision the prometheus data source
    type: file
    source: manifests/dashboard-start.yaml
  waitFor:
  - resource: deploy/scout
    namespace: starfleet
  - resource: deploy/scout
    namespace: outpost
  - resource: deploy/shuttle
    namespace: starfleet
testing:
  init:
  - name: verify-start
    description: Verify the intended starting fault and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: solution
    description: Reference solution applied by `astrona test`
    type: file
    source: solution/apply.sh
  - name: wait-for-prometheus
    description: Waits until Prometheus and Grafana answer and scout metrics exist
    type: file
    source: testing/wait-for-prometheus.sh
validation:
  scripts:
  - name: panels-return-data
    description: The provisioned dashboard keeps all three panels and every panel query returns data through its own data source
    type: file
    source: validation/validate-panels-data.sh
  - name: data-source-as-code
    description: The data source the panels use is provisioned from a ConfigMap, not created by hand
    type: file
    source: validation/validate-data-source-as-code.sh
teardown:
  keepCluster: false
