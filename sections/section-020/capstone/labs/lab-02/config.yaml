# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-020-capstone-020-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - quay.io/prometheus-operator/prometheus-operator:v0.94.1
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
      - quay.io/prometheus/prometheus:v3.15.0-distroless
      - ghcr.io/jkroepke/kube-webhook-certgen:1.8.9
      - docker.io/grafana/grafana:13.2.3-distroless
      - quay.io/kiwigrid/k8s-sidecar:2.14.1
      - grafana/loki:3.7.9
      - otel/opentelemetry-collector-contrib:0.162.0
      - python:3.13.18-alpine3.24
      - curlimages/curl:8.23.0

bootstrap:
  init:
    - name: prepare
      description: "Remove old answer files, install Helm if missing, a trimmed kube-prometheus-stack 92.3.0 and the starting dashboard"
      type: file
      source: bootstrap/01-prepare.sh
  manifests:
    - name: lab-start
      description: "Loki, the Collector, the Prometheus data source, three services with metrics and logs, and the traffic client"
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/loki
      namespace: logging
    - resource: daemonset/collector
      namespace: logging
    - resource: deploy/scout
      namespace: outpost
    - resource: deploy/probe
      namespace: outpost
    - resource: deploy/cargo
      namespace: outpost
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: data-source
      description: The Loki data source is editable, healthy and has Maximum lines set to 500
      type: file
      source: validation/validate-data-source.sh
    - name: panels
      description: Both dashboard panels show the incident through their own data sources
      type: file
      source: validation/validate-panels.sh
    - name: cause
      description: The answer files match what Prometheus and Loki recorded
      type: file
      source: validation/validate-cause.sh
    - name: fixed
      description: All services answer, with no failed requests and no new error lines in the last minute
      type: file
      source: validation/validate-fixed.sh

teardown:
  keepCluster: false
