# Plumbing: Loki 3.7.10 in single-binary mode and an OpenTelemetry Collector
# DaemonSet in `logging`. The Collector ships container logs from `outpost` and
# `starfleet` to Loki over OTLP, with the labels namespace, pod and container.
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logging
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      discover_service_name: []
      discover_log_levels: false
      otlp_config:
        resource_attributes:
          ignore_defaults: true
          attributes_config:
            - action: index_label
              attributes: [namespace, pod, container]
            - action: drop
              regex: .*
        log_attributes:
          - action: drop
            regex: .*
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: logging
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.7.10
          args:
            - -config.file=/etc/loki-config/loki.yaml
            - -target=all
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/loki-config
            - name: data
              mountPath: /tmp/loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: logging
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: logging
data:
  config.yaml: |
    receivers:
      file_log:
        include:
          - /var/log/pods/outpost_*/*/*.log
          - /var/log/pods/starfleet_*/*/*.log
        start_at: beginning
        include_file_path: true
        operators:
          - type: container
    processors:
      resource:
        attributes:
          - {key: namespace, from_attribute: k8s.namespace.name, action: upsert}
          - {key: pod, from_attribute: k8s.pod.name, action: upsert}
          - {key: container, from_attribute: k8s.container.name, action: upsert}
      # Loki stores a second timestamp as structured metadata when both are set,
      # and that metadata would split one stream into one series per line in an
      # ungrouped metric query. Clearing it keeps count(rate(...)) per stream.
      transform:
        log_statements:
          - set(log.observed_time_unix_nano, 0)
    exporters:
      otlp_http:
        endpoint: http://loki.logging:3100/otlp
    service:
      pipelines:
        logs:
          receivers: [file_log]
          processors: [resource, transform]
          exporters: [otlp_http]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collector
  namespace: logging
  labels:
    app: collector
spec:
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.165.0
          args:
            - --config=/etc/otelcol-config/config.yaml
          securityContext:
            runAsUser: 0
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-config
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: collector-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
---
# The provisioned Prometheus data source. Loki is left for the learner to add.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-prometheus
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://kps-prometheus.monitoring:9090
        isDefault: true
---
# One small application for all three services. It serves /work and /metrics, and
# fails /work when the directory named by STORE_PATH does not exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-app
  namespace: outpost
data:
  server.py: |
    import os
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    STORE_PATH = os.environ["STORE_PATH"]
    EXTRA_LINE = os.environ.get("EXTRA_LINE", "")
    counts = {"200": 0, "500": 0}
    lock = threading.Lock()


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *args):
            pass

        def reply(self, status, body):
            data = body.encode()
            self.send_response(status)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/metrics":
                with lock:
                    lines = ["# TYPE fleet_requests_total counter"]
                    for status, count in counts.items():
                        lines.append(f'fleet_requests_total{{status="{status}"}} {count}')
                self.reply(200, "\n".join(lines) + "\n")
                return
            if self.path != "/work":
                self.reply(404, "not found\n")
                return
            status = 200 if os.path.isdir(STORE_PATH) else 500
            with lock:
                counts[str(status)] += 1
            if status == 200:
                print('level=INFO msg="work done" status=200', flush=True)
            else:
                print(f'level=ERROR msg="cannot open store" status=500 path={STORE_PATH}', flush=True)
            if EXTRA_LINE:
                print(EXTRA_LINE, flush=True)
            self.reply(status, "done\n")


    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: outpost
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: python:3.13.18-alpine3.24
          command: ["python3", "/app/server.py"]
          env:
            - name: STORE_PATH
              value: "/data/store"
            - name: EXTRA_LINE
              value: ''
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: app
              mountPath: /app
            - name: store
              mountPath: /data/store
      volumes:
        - name: app
          configMap:
            name: fleet-app
        - name: store
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: scout
  namespace: outpost
  labels:
    app: scout
    part-of: fleet
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: outpost
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
        - name: probe
          image: python:3.13.18-alpine3.24
          command: ["python3", "/app/server.py"]
          env:
            - name: STORE_PATH
              value: "/data/store"
            - name: EXTRA_LINE
              value: 'level=WARN msg="client retried after error"'
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: app
              mountPath: /app
            - name: store
              mountPath: /data/store
      volumes:
        - name: app
          configMap:
            name: fleet-app
        - name: store
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: outpost
  labels:
    app: probe
    part-of: fleet
spec:
  selector:
    app: probe
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo
  namespace: outpost
  labels:
    app: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cargo
  template:
    metadata:
      labels:
        app: cargo
    spec:
      containers:
        - name: cargo
          image: python:3.13.18-alpine3.24
          command: ["python3", "/app/server.py"]
          env:
            - name: STORE_PATH
              value: "/data/missing"
            - name: EXTRA_LINE
              value: ''
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: app
              mountPath: /app
            - name: store
              mountPath: /data/store
      volumes:
        - name: app
          configMap:
            name: fleet-app
        - name: store
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cargo
  namespace: outpost
  labels:
    app: cargo
    part-of: fleet
spec:
  selector:
    app: cargo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fleet
  namespace: outpost
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      part-of: fleet
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.23.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                for service in scout probe cargo; do
                  curl -s -o /dev/null "http://$service.outpost:8080/work"
                done
                sleep 1
              done
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
