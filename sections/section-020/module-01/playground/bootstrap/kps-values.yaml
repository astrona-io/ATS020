# Trimmed kube-prometheus-stack 92.3.0 for the dashboards playground: the
# Prometheus Operator, one Prometheus and Grafana. Grafana's default dashboards
# and its default Prometheus data source are off, so the reader provisions
# both from labelled ConfigMaps. Alertmanager, node-exporter,
# kube-state-metrics, the default rules and the scrape jobs for Kubernetes
# components are off to save memory.
fullnameOverride: kps
defaultRules:
  create: false
alertmanager:
  enabled: false
grafana:
  enabled: true
  defaultDashboardsEnabled: false
  adminUser: admin
  adminPassword: starfleet
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: false
      alertmanager:
        enabled: false
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 6h
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 768Mi}
