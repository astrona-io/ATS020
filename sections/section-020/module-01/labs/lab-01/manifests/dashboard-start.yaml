# The starting dashboard, with two faults.
# 1. The ConfigMap has no `grafana_dashboard: "1"` label, so the Grafana
#    dashboard sidecar never copies it.
# 2. Every panel and the namespace variable use the data source UID
#    `prometheus-main`, but the provisioned data source has the UID `prometheus`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-scout-overview
  namespace: monitoring
data:
  scout-overview.json: |
    {
      "uid": "scout-overview",
      "title": "Scout Overview",
      "schemaVersion": 41,
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus-main"
            },
            "query": "label_values(http_requests_total, namespace)",
            "refresh": 1,
            "current": {
              "text": "starfleet",
              "value": "starfleet"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-main"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"$namespace\"}[1m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error ratio",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-main"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\", status=~\"5..\"}[1m])) / sum(rate(http_requests_total{namespace=\"$namespace\"}[1m]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-main"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        }
      ]
    }
