# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-020-lab-020-03-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - docker.io/grafana/grafana:13.2.3-distroless
    - quay.io/kiwigrid/k8s-sidecar:2.14.1
    - grafana/loki:3.7.9
    - otel/opentelemetry-collector-contrib:0.162.0
    - mccutchen/go-httpbin:2.25.0
    - curlimages/curl:8.22.0
bootstrap:
  init:
  - name: prepare
    description: Install Helm if missing, Grafana 13.2.3, the Loki data source and the starting dashboard
    type: file
    source: bootstrap/01-prepare.sh
  manifests:
  - name: lab-start
    description: Starting resources for find and stop error-logging workloads
    type: file
    source: manifests/lab-start.yaml
  waitFor:
  - resource: deploy/loki
    namespace: logging
  - resource: daemonset/collector
    namespace: logging
  - resource: deploy/probe
    namespace: outpost
  - resource: statefulset/cargo
    namespace: outpost
  - resource: deploy/beacon
    namespace: outpost
  - resource: deploy/scout
    namespace: outpost
  - resource: deploy/relay
    namespace: starfleet
  - resource: deploy/shuttle
    namespace: starfleet
testing:
  init:
  - name: verify-start
    description: Verify the intended starting fault and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: solution
    description: Reference solution applied by `astrona test`
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: scaled
    description: Every controller in outpost that wrote ERROR lines runs no Pods and the others still run
    type: file
    source: validation/validate-scaled.sh
teardown:
  keepCluster: false
