# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Query Logs With Loki And LogQL (PLAYGROUND).
# A clean sandbox: Grafana, Loki 3.7.9, a Collector DaemonSet and workloads that
# write log lines. No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-020-playground-020-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - docker.io/grafana/grafana:13.2.3-distroless
      - quay.io/kiwigrid/k8s-sidecar:2.14.1
      - grafana/loki:3.7.9
      - otel/opentelemetry-collector-contrib:0.165.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.23.0

bootstrap:
  init:
    - name: prepare
      description: "Install Helm if missing, Grafana 13.2.3 from a trimmed kube-prometheus-stack 92.22.0, and the starting dashboard"
      type: file
      source: bootstrap/prepare.sh
  manifests:
    - name: lab-start
      description: "Loki, the Collector and the workloads that write log lines"
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/loki
      namespace: logging
    - resource: daemonset/collector
      namespace: logging
    - resource: deploy/probe
      namespace: outpost
    - resource: statefulset/depot
      namespace: outpost
    - resource: deploy/beacon
      namespace: outpost
    - resource: deploy/scout
      namespace: outpost
    - resource: deploy/relay
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
