# Starting workloads for the logging lab: `scout` (podinfo) in
# `starfleet`, `probe` (go-httpbin) in `outpost`, and a `shuttle` pod whose
# loop sends steady traffic to both. Every 4th second it asks `probe` for a
# `500`, so `probe` writes both normal and error log lines.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: outpost
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
        - name: probe
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /status/200
              port: http
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: outpost
  labels:
    app: probe
spec:
  selector:
    app: probe
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shuttle-traffic
  namespace: starfleet
data:
  traffic.sh: |
    #!/bin/sh
    # Steady traffic for the logging lab. Every second: one normal
    # request to scout and one to probe. Every 4th second: one /status/500
    # to probe, which makes probe log an error line.
    i=0
    while true; do
      i=$((i+1))
      curl -s -o /dev/null http://scout.starfleet:9898/
      curl -s -o /dev/null http://probe.outpost:8080/get
      [ $((i % 4)) -eq 0 ] && curl -s -o /dev/null http://probe.outpost:8080/status/500
      sleep 1
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sh", "/traffic/traffic.sh"]
          volumeMounts:
            - name: traffic
              mountPath: /traffic
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
      volumes:
        - name: traffic
          configMap:
            name: shuttle-traffic
