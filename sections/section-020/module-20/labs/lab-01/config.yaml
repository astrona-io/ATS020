# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-020-lab-020-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    # mccutchen/go-httpbin:2.25.0 is not preloaded; the node pulls it. With
    # the containerd image store of Docker 29, go-httpbin and the cert-manager
    # images conflict: whichever is pulled second fails
    # `docker save --platform linux/amd64`, so the preload stops (checked
    # 2026-11-09).
    preloadImages:
      - quay.io/jetstack/cert-manager-controller:v1.21.3
      - quay.io/jetstack/cert-manager-webhook:v1.21.3
      - quay.io/jetstack/cert-manager-cainjector:v1.21.3
      - ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator:0.162.0
      - otel/opentelemetry-collector-contrib:0.162.0
      - quay.io/prometheus-operator/prometheus-operator:v0.94.1
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
      - quay.io/prometheus/prometheus:v3.15.0-distroless
      - ghcr.io/jkroepke/kube-webhook-certgen:1.8.9
      - ghcr.io/stefanprodan/podinfo:6.17.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: install-stack
      description: "Install cert-manager 1.21.3, the OpenTelemetry Operator 0.162.0 and a trimmed kube-prometheus-stack 92.22.0"
      type: file
      source: bootstrap/01-install-stack.sh
  manifests:
    - name: lab-start
      description: "Namespaces, scout in starfleet, probe in outpost, and the shuttle traffic loop"
      type: file
      source: manifests/lab-start.yaml
    - name: collector-start
      description: "The logs Collector, its ClusterRole and a ServiceMonitor, with two faults"
      type: file
      source: manifests/collector-start.yaml
  waitFor:
    - resource: deploy/probe
      namespace: outpost
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: daemonset/logs-collector
      namespace: monitoring

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh
    - name: wait-for-prometheus
      description: Waits until Prometheus answers queries
      type: file
      source: testing/wait-for-prometheus.sh

validation:
  scripts:
    - name: target-up
      description: Prometheus scrapes the Collector's metric endpoint and the target is up
      type: file
      source: validation/validate-target-up.sh
    - name: error-metric
      description: log_error_lines_total carries the probe deployment and outpost namespace labels and keeps rising
      type: file
      source: validation/validate-error-metric.sh
    - name: least-privilege
      description: The Collector keeps its pipeline and gets only read access to pods
      type: file
      source: validation/validate-least-privilege.sh

teardown:
  keepCluster: false
