# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Collect Pod Logs With The OpenTelemetry Collector (PLAYGROUND).
# A clean sandbox: it starts, installs cert-manager, the OpenTelemetry
# Operator and a trimmed Prometheus, deploys the Starfleet workloads with a
# traffic loop, then stays running for free exploration. No Collector exists
# yet. No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-020-playground-020-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    # mccutchen/go-httpbin:2.25.0 is not preloaded; the node pulls it. With
    # the containerd image store of Docker 29, go-httpbin and the cert-manager
    # images conflict: whichever is pulled second fails
    # `docker save --platform linux/amd64`, so the preload stops (checked
    # 2026-11-09).
    preloadImages:
      - quay.io/jetstack/cert-manager-controller:v1.21.3
      - quay.io/jetstack/cert-manager-webhook:v1.21.3
      - quay.io/jetstack/cert-manager-cainjector:v1.21.3
      - ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator:0.162.0
      - otel/opentelemetry-collector-contrib:0.162.0
      - quay.io/prometheus-operator/prometheus-operator:v0.94.1
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
      - quay.io/prometheus/prometheus:v3.15.0-distroless
      - ghcr.io/jkroepke/kube-webhook-certgen:1.8.9
      - ghcr.io/stefanprodan/podinfo:6.17.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: prepare
      description: "Install cert-manager 1.21.3, the OpenTelemetry Operator 0.162.0 and a trimmed kube-prometheus-stack 92.22.0 (Prometheus Operator and one Prometheus)"
      type: file
      source: bootstrap/prepare.sh
  manifests:
    - name: lab-start
      description: "Namespaces, scout in starfleet, probe in outpost, and the shuttle traffic loop"
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/probe
      namespace: outpost
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
