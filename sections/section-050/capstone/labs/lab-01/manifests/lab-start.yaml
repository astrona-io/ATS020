# Starting objects for the capstone. A release went out and starfleet is
# broken on purpose in four independent ways. Never fix a fault here.
#
# Fault 1: cargo is OOMKilled, because the memory limit is 48Mi and the process
#          holds 150Mi.
# Fault 2: beacon is in ImagePullBackOff, because the image tag v6.15.0 does not exist.
# Fault 3: probe is restarted again and again, because the liveness probe uses port 8081.
# Fault 4: the Service starfleet-policy selects pods with the label
#          app=starfleet-policy-v2. No pod has it, so the webhook has no endpoints
#          and every create of a Deployment in starfleet fails.
#
# The webhook checks only CREATE of Deployments, and its configuration comes last
# in this file, so the workloads above it are created before it can reject them.
---
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cargo
  namespace: starfleet
spec:
  selector:
    app: cargo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: beacon
  namespace: starfleet
spec:
  selector:
    app: beacon
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
        - name: probe
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /status/200
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo
  namespace: starfleet
  labels:
    app: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cargo
  template:
    metadata:
      labels:
        app: cargo
    spec:
      containers:
        - name: cargo
          image: node:22-alpine
          command:
            - node
            - -e
            - |
              const hold = Buffer.alloc(150 * 1024 * 1024, 1);
              require("http")
                .createServer((req, res) => res.end("cargo holds " + hold.length + " bytes\n"))
                .listen(8080);
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 48Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
  namespace: starfleet
  labels:
    app: beacon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      containers:
        - name: beacon
          image: ghcr.io/stefanprodan/podinfo:v6.15.0
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Namespace
metadata:
  name: webhook-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-server
  namespace: webhook-system
data:
  server.js: |
    // A validating admission webhook that allows every request.
    // It listens on HTTPS port 8443 and reads its certificate once, at start.
    const https = require('https');
    const fs = require('fs');
    const options = {
      cert: fs.readFileSync('/tls/tls.crt'),
      key: fs.readFileSync('/tls/tls.key'),
    };
    https.createServer(options, (req, res) => {
      let body = '';
      req.on('data', (chunk) => (body += chunk));
      req.on('end', () => {
        let uid = '';
        try { uid = JSON.parse(body).request.uid; } catch (e) {}
        console.log(`${req.method} ${req.url} uid=${uid} allowed`);
        res.setHeader('Content-Type', 'application/json');
        res.end(JSON.stringify({
          apiVersion: 'admission.k8s.io/v1',
          kind: 'AdmissionReview',
          response: { uid, allowed: true },
        }));
      });
    }).listen(8443, () => console.log('listening on 8443'));
---
