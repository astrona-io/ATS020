apiVersion: apps/v1
kind: Deployment
metadata:
  name: starfleet-policy
  namespace: webhook-system
  labels:
    app: starfleet-policy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starfleet-policy
  template:
    metadata:
      labels:
        app: starfleet-policy
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: server
          image: node:22-alpine
          command: ["node", "/app/server.js"]
          ports:
            - containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: app
              mountPath: /app
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: webhook-server
        - name: tls
          secret:
            secretName: starfleet-policy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: starfleet-policy
  namespace: webhook-system
spec:
  selector:
    app: starfleet-policy-v2
  ports:
    - port: 443
      targetPort: 8443
---
