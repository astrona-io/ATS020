# Starting objects for the playground. The platform is broken on purpose in three
# independent ways. Never fix a fault here.
#
# Fault 1: the Service starfleet-policy selects pods with the label app=starfleet-policy-v2.
# No pod has it, so the Service has no endpoints and every create of a Deployment in
# starfleet fails.
# Fault 2: the serving certificate of the outpost webhook expired on 2025-01-08, so
# every create of a Deployment in outpost fails with an x509 error. The CA that
# signed it is in the Secret webhook-ca, so a new certificate can be signed.
# Fault 3: the Prometheus Operator was scaled to zero in bootstrap/prepare.sh, so
# the ServiceMonitor and PrometheusRule below never reach Prometheus.
#
# The webhooks check only CREATE of Deployments, and the configurations come last
# in this file, so the workloads below are created before any webhook can reject them.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: Namespace
metadata:
  name: webhook-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scout
  namespace: starfleet
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: scout
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scout-alerts
  namespace: starfleet
  labels:
    release: kps
spec:
  groups:
    - name: scout
      rules:
        - alert: ScoutDown
          expr: up{job="scout"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: The scout target is down
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drifter
  template:
    metadata:
      labels:
        app: drifter
    spec:
      containers:
        - name: drifter
          image: curlimages/curl:8.22.0
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-server
  namespace: webhook-system
data:
  server.js: |
    // A validating admission webhook that allows every request.
    // It listens on HTTPS port 8443 and reads its certificate once, at start.
    const https = require('https');
    const fs = require('fs');
    const options = {
      cert: fs.readFileSync('/tls/tls.crt'),
      key: fs.readFileSync('/tls/tls.key'),
    };
    https.createServer(options, (req, res) => {
      let body = '';
      req.on('data', (chunk) => (body += chunk));
      req.on('end', () => {
        let uid = '';
        try { uid = JSON.parse(body).request.uid; } catch (e) {}
        console.log(`${req.method} ${req.url} uid=${uid} allowed`);
        res.setHeader('Content-Type', 'application/json');
        res.end(JSON.stringify({
          apiVersion: 'admission.k8s.io/v1',
          kind: 'AdmissionReview',
          response: { uid, allowed: true },
        }));
      });
    }).listen(8443, () => console.log('listening on 8443'));
---
