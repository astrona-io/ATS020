              mountPath: /tls
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: webhook-server
        - name: tls
          secret:
            secretName: outpost-policy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: outpost-policy
  namespace: webhook-system
spec:
  selector:
