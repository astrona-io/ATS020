# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Diagnose And Fix Broken Platform Components (PLAYGROUND).
# A clean sandbox that starts broken on purpose: two admission webhooks block
# creates (a Service without endpoints, an expired serving certificate) and the
# Prometheus Operator is scaled to zero. No task, no grading, no `astrona submit`.
# The bootstrap never fixes a fault.
apiVersion: astrona.io/v1
metadata:
  name: ats-020-playground-050-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - quay.io/prometheus-operator/prometheus-operator:v0.94.1
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
      - quay.io/prometheus/prometheus:v3.15.0-distroless
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - node:22-alpine
      - curlimages/curl:8.23.0

bootstrap:
  init:
    - name: prepare
      description: "Install Helm if missing and a trimmed kube-prometheus-stack 92.3.0 in `monitoring`, then scale the Prometheus Operator to zero"
      type: file
      source: bootstrap/prepare.sh
  manifests:
    - name: lab-start
      description: "The Starfleet workloads, the two webhooks with their faults, a ServiceMonitor and a PrometheusRule"
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/starfleet-policy
      namespace: webhook-system

teardown:
  keepCluster: false
