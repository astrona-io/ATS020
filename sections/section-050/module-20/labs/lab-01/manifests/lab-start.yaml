apiVersion: apps/v1
kind: Deployment
metadata:
  name: starfleet-policy
  namespace: webhook-system
  labels:
    app: starfleet-policy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starfleet-policy
  template:
    metadata:
      labels:
        app: starfleet-policy
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: node:22-alpine
        command:
        - node
        - /app/server.js
        ports:
        - containerPort: 8443
        readinessProbe:
          tcpSocket:
            port: 8443
          periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: webhook-server
      - name: tls
        secret:
          secretName: starfleet-policy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: starfleet-policy
  namespace: webhook-system
spec:
  selector:
    app: starfleet-policy
  ports:
  - port: 443
    targetPort: 8444
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: starfleet-policy
webhooks:
- name: starfleet-policy.astrona.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  timeoutSeconds: 5
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: starfleet
  rules:
  - apiGroups:
    - apps
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - deployments
  clientConfig:
    service:
      namespace: webhook-system
      name: starfleet-policy
      path: /validate
      port: 443
    caBundle: 
