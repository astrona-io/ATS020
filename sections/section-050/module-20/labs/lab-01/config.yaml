# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-020-lab-050-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - node:22-alpine
bootstrap:
  manifests:
  - name: lab-start
    description: Starting resources for repair a webhook service port
    type: file
    source: manifests/lab-start.yaml
  waitFor:
  - resource: deploy/starfleet-policy
    namespace: webhook-system
testing:
  init:
  - name: verify-start
    description: Verify the intended starting fault and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: solution
    description: Reference solution applied by `astrona test`
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: starfleet-creates
    description: A Deployment can be created in starfleet, and the starfleet-policy webhook answered the request; both webhook configurations keep failurePolicy Fail, and the workloads, ServiceMonitor and PrometheusRule
    type: file
    source: validation/validate-starfleet-webhook.sh
teardown:
  keepCluster: false
