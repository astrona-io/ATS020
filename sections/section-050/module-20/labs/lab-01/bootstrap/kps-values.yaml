# Trimmed kube-prometheus-stack 92.22.0 for the platform-faults playground: the
# Prometheus Operator and one Prometheus. Alertmanager, Grafana, node-exporter,
# kube-state-metrics, the default rules and the scrape jobs for Kubernetes
# components are off to save memory. The chart's own admission webhook is off,
# so a PrometheusRule can be created while the Prometheus Operator is stopped.
fullnameOverride: kps
defaultRules:
  create: false
alertmanager:
  enabled: false
grafana:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 64Mi}
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 6h
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 768Mi}
