apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: Namespace
metadata:
  name: webhook-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-server
  namespace: webhook-system
data:
  server.js: |
    // A validating admission webhook that allows every request.
    // It listens on HTTPS port 8443 and reads its certificate once, at start.
    const https = require('https');
    const fs = require('fs');
    const options = {
      cert: fs.readFileSync('/tls/tls.crt'),
      key: fs.readFileSync('/tls/tls.key'),
    };
    https.createServer(options, (req, res) => {
      let body = '';
      req.on('data', (chunk) => (body += chunk));
      req.on('end', () => {
        let uid = '';
        try { uid = JSON.parse(body).request.uid; } catch (e) {}
        console.log(`${req.method} ${req.url} uid=${uid} allowed`);
        res.setHeader('Content-Type', 'application/json');
        res.end(JSON.stringify({
          apiVersion: 'admission.k8s.io/v1',
          kind: 'AdmissionReview',
          response: { uid, allowed: true },
        }));
      });
    }).listen(8443, () => console.log('listening on 8443'));
---
