apiVersion: apps/v1
kind: Deployment
metadata:
  name: outpost-policy
  namespace: webhook-system
  labels:
    app: outpost-policy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outpost-policy
  template:
    metadata:
      labels:
        app: outpost-policy
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: server
        image: node:22-alpine
        command:
        - node
        - /app/server.js
        ports:
        - containerPort: 8443
        readinessProbe:
          tcpSocket:
            port: 8443
          periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: webhook-server
      - name: tls
        secret:
          secretName: outpost-policy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: outpost-policy
  namespace: webhook-system
spec:
  selector:
    app: outpost-policy
  ports:
  - port: 443
    targetPort: 8443
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: outpost-policy
webhooks:
- name: outpost-policy.astrona.io
  admissionReviewVersions:
  - v1
  sideEffects: None
  failurePolicy: Fail
  timeoutSeconds: 5
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: outpost
  rules:
  - apiGroups:
    - apps
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - deployments
  clientConfig:
    service:
      namespace: webhook-system
      name: outpost-policy
      path: /validate
      port: 443
    caBundle: 
