# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-020-lab-050-02-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - quay.io/prometheus-operator/prometheus-operator:v0.94.1
    - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
    - quay.io/prometheus/prometheus:v3.15.0-distroless
    - ghcr.io/stefanprodan/podinfo:6.17.0
    - node:22-alpine
    - curlimages/curl:8.23.0
bootstrap:
  init:
  - name: prepare
    description: Install Helm if missing and a trimmed kube-prometheus-stack 92.22.0 in `monitoring`, then scale
      the Prometheus Operator to zero
    type: file
    source: bootstrap/01-prepare.sh
  manifests:
  - name: lab-start
    description: Starting resources for restore the prometheus operator
    type: file
    source: manifests/lab-start.yaml
  waitFor:
  - resource: deploy/shuttle
    namespace: starfleet
  - resource: deploy/scout
    namespace: starfleet
testing:
  init:
  - name: verify-start
    description: Verify the intended starting fault and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: solution
    description: Reference solution applied by `astrona test`
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: scout-monitored
    description: The Prometheus Operator runs, up{job="scout"} is 1 and the ScoutDown rule is loaded in Prometheus; both webhook configurations keep failurePolicy Fail, and the workloads, ServiceMonitor and PrometheusRule
    type: file
    source: validation/validate-prometheus.sh
teardown:
  keepCluster: false
