# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Triage And Fix Failing Workloads (PLAYGROUND).
# A clean sandbox that starts broken on purpose: six Deployments in the
# namespace starfleet fail in different ways, and `shuttle` is healthy.
# No task, no grading, no `astrona submit`. The bootstrap never fixes a fault.
apiVersion: astrona.io/v1
metadata:
  name: ats-020-playground-050-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      metricsServer: true
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - node:22-alpine
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: prepare
      description: "Wait until metrics-server answers, so kubectl top works"
      type: file
      source: bootstrap/prepare.sh
  manifests:
    - name: lab-start
      description: "The namespace starfleet, the healthy shuttle client and six faulty workloads"
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
