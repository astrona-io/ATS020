# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-020-lab-050-01-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - node:22-alpine
    - curlimages/curl:8.23.0
bootstrap:
  manifests:
  - name: lab-start
    description: Starting resources for repair an oomkilled workload
    type: file
    source: manifests/lab-start.yaml
  - name: faults-start
    description: Starting resources for repair an oomkilled workload
    type: file
    source: manifests/faults-start.yaml
  waitFor:
  - resource: deploy/shuttle
    namespace: starfleet
testing:
  init:
  - name: verify-start
    description: Verify the intended starting fault and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: solution
    description: Reference solution applied by `astrona test`
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: cargo-limit
    description: cargo keeps a memory limit that fits its use (256Mi to 1Gi), has no OOMKilled restart and answers; the workload keeps one replica and its Service, and shuttle keeps its image
      200
    type: file
    source: validation/validate-cargo.sh
teardown:
  keepCluster: false
