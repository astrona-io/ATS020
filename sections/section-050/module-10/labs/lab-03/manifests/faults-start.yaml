apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo
  namespace: starfleet
  labels:
    app: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cargo
  template:
    metadata:
      labels:
        app: cargo
    spec:
      containers:
      - name: cargo
        image: node:22-alpine
        command:
        - node
        - -e
        - |
          const hold = Buffer.alloc(150 * 1024 * 1024, 1);
          require("http")
            .createServer((req, res) => res.end("cargo holds " + hold.length + " bytes\n"))
            .listen(8080);
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 48Mi
