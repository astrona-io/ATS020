# Starting objects for the playground. Every Deployment except shuttle is
# broken on purpose, each in a different way. Never fix a fault here.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
---
# Fault 1: Pending. The container asks for 64 CPU cores and the node has fewer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests: {cpu: "64", memory: 64Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: scout
  namespace: starfleet
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 9898
      targetPort: http
---
# Fault 2: Pending. The pod mounts a PersistentVolumeClaim that does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: starfleet
  labels:
    app: bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      containers:
        - name: bridge
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bridge-data
---
apiVersion: v1
kind: Service
metadata:
  name: bridge
  namespace: starfleet
spec:
  selector:
    app: bridge
  ports:
    - name: http
      port: 9898
      targetPort: http
---
# Fault 3: the liveness probe asks for a path that probe does not serve, so the
# kubelet restarts the container again and again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
        - name: probe
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Fault 4: CrashLoopBackOff. The process exits with code 3 because the
# environment variable ENGINE_MODE is not set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  namespace: starfleet
  labels:
    app: engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine
  template:
    metadata:
      labels:
        app: engine
    spec:
      containers:
        - name: engine
          image: curlimages/curl:8.22.0
          command:
            - sh
            - -c
            - |
              if [ -z "$ENGINE_MODE" ]; then
                echo "fatal: ENGINE_MODE is not set" >&2
                exit 3
              fi
              echo "engine started in $ENGINE_MODE mode"
              sleep infinity
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
---
# Fault 5: OOMKilled. The process holds about 150 MiB and the limit is 64 MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo
  namespace: starfleet
  labels:
    app: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cargo
  template:
    metadata:
      labels:
        app: cargo
    spec:
      containers:
        - name: cargo
          image: node:22-alpine
          command:
            - node
            - -e
            - |
              const hold = Buffer.alloc(150 * 1024 * 1024, 1);
              require("http")
                .createServer((req, res) => res.end("cargo holds " + hold.length + " bytes\n"))
                .listen(8080);
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: cargo
  namespace: starfleet
spec:
  selector:
    app: cargo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
