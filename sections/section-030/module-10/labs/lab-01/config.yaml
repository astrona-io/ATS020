# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-020-lab-030-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - quay.io/jetstack/cert-manager-controller:v1.21.2
      - quay.io/jetstack/cert-manager-webhook:v1.21.2
      - quay.io/jetstack/cert-manager-cainjector:v1.21.2
      - ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator:0.160.0
      - otel/opentelemetry-collector-contrib:0.162.0
      - jaegertracing/jaeger:2.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.23.0

bootstrap:
  init:
    - name: install-operator
      description: "Install cert-manager 1.21.2 and the OpenTelemetry Operator 0.160.0, and wait for its webhook"
      type: file
      source: bootstrap/01-install-operator.sh
  manifests:
    - name: lab-start
      description: "Jaeger 2.22.0 in observability, scout with tracing on in starfleet, and the shuttle traffic loop"
      type: file
      source: manifests/lab-start.yaml
    - name: collector-start
      description: "The Collector otel in observability, with two faults in its exporter"
      type: file
      source: manifests/collector-start.yaml
  waitFor:
    - resource: deploy/jaeger
      namespace: observability
    - resource: deploy/otel-collector
      namespace: observability
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh
    - name: wait-for-pipeline
      description: Waits until the fixed Collector has sent spans
      type: file
      source: testing/wait-for-pipeline.sh

validation:
  scripts:
    - name: collector-intact
      description: The Collector otel is still a deployment with the Service otel-collector on 4317, and scout still sends to it
      type: file
      source: validation/validate-collector-intact.sh
    - name: collector-counters
      description: The Collector's own counters show spans accepted and sent
      type: file
      source: validation/validate-collector-counters.sh
    - name: trace-in-jaeger
      description: Jaeger holds recent spans from the service scout
      type: file
      source: validation/validate-trace-in-jaeger.sh

teardown:
  keepCluster: false
