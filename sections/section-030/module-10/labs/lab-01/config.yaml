# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-020-lab-030-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - jaegertracing/jaeger:2.23.0
      - python:3.13.18-alpine3.24

  # The host port is not Jaeger's own port (16686) and stays below 32768, so it
  # does not clash with a local Jaeger or the ports the operating system hands
  # out for outgoing connections.
  portForwards:
    - name: jaeger-ui
      resource: svc/jaeger
      namespace: tracing
      hostPort: 26686
      targetPort: 16686
      scheme: http
      description: Jaeger UI, the traces of probe appear here after the fix

tabs:
  - name: jaeger
    title: Jaeger
    type: browser
    portForward: jaeger-ui
    path: /search

bootstrap:
  init:
    - name: prepare
      description: Check that the terminal has kubectl, curl and jq, and remove the answer file left by an earlier attempt
      type: file
      source: bootstrap/01-prepare.sh
  manifests:
    - name: lab-start
      description: "Jaeger 2.23.0 in tracing, and probe in outpost with OpenTelemetry switched off and the wrong OTLP endpoint"
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/jaeger
      namespace: tracing
    - resource: deploy/probe
      namespace: outpost

testing:
  init:
    - name: verify-start
      description: Prove that nothing is solved and every grader fails before the reference solution
      type: file
      source: testing/verify-start.sh
    - name: solution
      description: Switch tracing on, fix the endpoint, wait for spans and export the exception events
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: otel-enabled
      description: OTEL_ENABLED of the Deployment probe is true and its new pod is ready
      type: file
      source: validation/validate-otel-enabled.sh
    - name: exporter-endpoint
      description: OTEL_EXPORTER_OTLP_ENDPOINT of probe is the Service jaeger in tracing on port 4318
      type: file
      source: validation/validate-exporter-endpoint.sh
    - name: spans-in-jaeger
      description: Jaeger holds recent probe spans with an exception event
      type: file
      source: validation/validate-spans-in-jaeger.sh
    - name: exception-exported
      description: /tmp/ats-020-exception.json holds exception events of probe that the running Jaeger also holds
      type: file
      source: validation/validate-exception-exported.sh

teardown:
  keepCluster: false
