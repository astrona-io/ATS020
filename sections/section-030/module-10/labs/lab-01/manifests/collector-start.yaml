# The broken Collector for the "Fix A Broken Collector Pipeline" lab.
#
# The Operator accepts this resource and the pod is Running, but no span
# reaches Jaeger. The exporter has two faults, one behind the other:
#   1. the host `jaeger-collector.observability` is not a Service that exists
#      (the Collector logs "no children to pick from"),
#   2. the exporter has no `tls.insecure: true`, so after fault 1 is fixed it
#      tries TLS against a Jaeger OTLP port that speaks plain gRPC (the
#      Collector logs "first record does not look like a TLS handshake").
# Do not fix this in the bootstrap. The fault is the material.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: observability
spec:
  mode: deployment
  image: otel/opentelemetry-collector-contrib:0.162.0
  config:
    receivers:
      otlp/grpc:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
    exporters:
      otlp_grpc:
        endpoint: jaeger-collector.observability:4317
    service:
      pipelines:
        traces:
          receivers: [otlp/grpc]
          processors: [batch]
          exporters: [otlp_grpc]
