# Starting state for the "Send Spans From A Pod To Jaeger" lab: Jaeger 2.23.0
# (one pod, in-memory storage) in the namespace `tracing`, and the trace
# emitter `probe` in its own namespace `outpost`.
#
# `probe` is broken on purpose, in two ways that both stop its spans:
#   1. OTEL_ENABLED is "false", so the program creates no spans at all,
#   2. OTEL_EXPORTER_OTLP_ENDPOINT names jaeger.observability, a namespace that
#      does not exist here (Jaeger runs in `tracing`).
# TARGET_URL names a Service that does not exist, so once spans flow, each one
# ends with the status ERROR and an `exception` event. That error is the
# evidence the learner exports, not a fault to repair.
# Do not fix this in the bootstrap. The fault is the material.
apiVersion: v1
kind: Namespace
metadata:
  name: tracing
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: tracing
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
          readinessProbe:
            httpGet:
              path: /
              port: ui
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: tracing
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: ui
      port: 16686
      targetPort: ui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trace-emitter
  namespace: outpost
data:
  emitter.py: |
    """Send one span every 2 seconds over OTLP/HTTP in OpenTelemetry Protocol JSON.

    OTEL_ENABLED must be "true", or the program creates no spans.
    OTEL_EXPORTER_OTLP_ENDPOINT is the base address of the OTLP/HTTP receiver;
    the program adds the path /v1/traces, as the OpenTelemetry SDKs do.
    Inside each span the program sends one HTTP request to TARGET_URL. When the
    request fails, the span gets the status code ERROR (2) and one span event
    named "exception" with the attributes that the OpenTelemetry semantic
    conventions define for a recorded exception.
    """
    import json
    import os
    import secrets
    import time
    import traceback
    import urllib.request

    service = os.environ["TRACE_SERVICE"]
    target_url = os.environ["TARGET_URL"]
    enabled = os.environ.get("OTEL_ENABLED", "false").strip().lower() == "true"
    endpoint = os.environ.get("OTEL_EXPORTER_OTLP_ENDPOINT", "").rstrip("/")


    def string_attributes(pairs):
        return [{"key": key, "value": {"stringValue": value}} for key, value in pairs.items()]


    if enabled:
        print(f"OpenTelemetry is on: sending spans to {endpoint}/v1/traces", flush=True)
    else:
        print("OpenTelemetry is off (OTEL_ENABLED is not true): no spans are created", flush=True)

    while True:
        started = time.time_ns()
        span = {
            "traceId": secrets.token_hex(16),
            "spanId": secrets.token_hex(8),
            "name": "call-target",
            "kind": 3,
            "startTimeUnixNano": str(started),
            "attributes": string_attributes({"target.url": target_url}),
            "events": [],
            "status": {"code": 1},
        }
        try:
            with urllib.request.urlopen(target_url, timeout=3) as response:
                response.read()
        except Exception as error:  # noqa: BLE001 - every failure must land in the span
            span["status"] = {"code": 2, "message": f"{type(error).__name__}: {error}"}
            span["events"].append({
                "timeUnixNano": str(time.time_ns()),
                "name": "exception",
                "attributes": string_attributes({
                    "exception.type": type(error).__name__,
                    "exception.message": str(error),
                    "exception.stacktrace": traceback.format_exc(),
                }),
            })
        span["endTimeUnixNano"] = str(time.time_ns())
        if enabled:
            payload = {"resourceSpans": [{
                "resource": {"attributes": string_attributes({"service.name": service})},
                "scopeSpans": [{"scope": {"name": "astrona-trace-fixture"}, "spans": [span]}],
            }]}
            request = urllib.request.Request(
                f"{endpoint}/v1/traces",
                data=json.dumps(payload).encode(),
                headers={"Content-Type": "application/json"},
            )
            try:
                with urllib.request.urlopen(request, timeout=5) as response:
                    response.read()
            except Exception as error:  # noqa: BLE001 - a bad endpoint must not stop the loop
                print(f"Span export to {endpoint}/v1/traces failed: {error}", flush=True)
        time.sleep(2)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: outpost
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      # The program does not handle SIGTERM; a short grace period lets the old
      # pod go quickly after each change.
      terminationGracePeriodSeconds: 5
      containers:
        - name: probe
          image: python:3.13.18-alpine3.24
          command:
            - python3
            - /emitter/emitter.py
          env:
            - name: TRACE_SERVICE
              value: probe
            # No Service named relay exists in outpost: every call fails and
            # every span records an exception. Leave it as it is.
            - name: TARGET_URL
              value: http://relay.outpost:8080
            # Fault 1: tracing is switched off.
            - name: OTEL_ENABLED
              value: "false"
            # Fault 2: Jaeger does not run in observability.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.observability:4318
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 48Mi}
          volumeMounts:
            - name: emitter
              mountPath: /emitter
              readOnly: true
      volumes:
        - name: emitter
          configMap:
            name: trace-emitter
