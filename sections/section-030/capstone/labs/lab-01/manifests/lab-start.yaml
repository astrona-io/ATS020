# Starting workloads for the distributed tracing capstone: Jaeger 2.23.0 (one
# pod, in-memory storage); `scout` (podinfo) in `starfleet` with its own
# tracing on, but with a wrong exporter port (4318 is OTLP over HTTP and
# podinfo speaks gRPC); the ConfigMap, Service and Deployment of `relay`,
# with no annotation; and a `shuttle` pod that sends steady traffic to
# `relay`. No Collector and no Instrumentation exist: the learner writes them.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
          readinessProbe:
            httpGet:
              path: /
              port: ui
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: ui
      port: 16686
      targetPort: ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          command:
            - ./podinfo
            - --port=9898
            - --otel-service-name=scout
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-app
  namespace: starfleet
data:
  server.js: |
    // relay: a small HTTP front service. Every request to relay makes one
    // request to scout and returns scout's answer. /slow asks scout for
    // /delay/1, so that request takes about one second inside scout.
    const http = require("http");
    const SCOUT = process.env.SCOUT_URL || "http://scout.starfleet:9898";

    function callScout(path, res) {
      http.get(SCOUT + path, (upstream) => {
        let body = "";
        upstream.on("data", (chunk) => (body += chunk));
        upstream.on("end", () => {
          res.writeHead(upstream.statusCode, { "Content-Type": "application/json" });
          res.end(body);
        });
      }).on("error", (err) => {
        res.writeHead(502);
        res.end("scout unreachable: " + err.message + "\n");
      });
    }

    http.createServer((req, res) => {
      if (req.url === "/slow") return callScout("/delay/1", res);
      callScout("/", res);
    }).listen(8080, () => console.log("relay listening on :8080"));

    // Stop at once on SIGTERM, so a rollout does not wait for the grace period.
    process.on("SIGTERM", () => process.exit(0));
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: starfleet
  labels:
    app: relay
spec:
  selector:
    app: relay
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shuttle-traffic
  namespace: starfleet
data:
  traffic.sh: |
    #!/bin/sh
    # Steady traffic for the auto-instrumentation playground. Every 2
    # seconds: one request to relay, which calls scout. Every 5th round: one
    # request to relay /slow, which makes scout wait one second.
    i=0
    while true; do
      i=$((i+1))
      curl -s -o /dev/null http://relay.starfleet:8080/
      [ $((i % 5)) -eq 0 ] && curl -s -o /dev/null http://relay.starfleet:8080/slow
      sleep 2
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sh", "/traffic/traffic.sh"]
          volumeMounts:
            - name: traffic
              mountPath: /traffic
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
      volumes:
        - name: traffic
          configMap:
            name: shuttle-traffic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: starfleet
  labels:
    app: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: node:22-alpine
          command: ["node", "/app/server.js"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: app
          configMap:
            name: relay-app
