# The Argo CD project `default`. The Argo CD server normally creates it. The
# server is scaled to zero here, so this file creates it before the
# Application `scout` needs it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  sourceRepos: ['*']
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
