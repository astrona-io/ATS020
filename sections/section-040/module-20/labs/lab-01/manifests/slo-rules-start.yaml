# The faulty starting state: the PrometheusRule `scout-slo` has two recording
# rules for the error ratio of scout and one burn-rate alert that reads them.
# The selector status=~"5xx" matches the literal text "5xx", which no status
# has, so both recording rules return no data and the alert never fires.
# The fault is the material: do not fix it in the bootstrap.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scout-slo
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: scout-slo
      rules:
        - record: scout:error_ratio:rate5m
          expr: sum(rate(http_requests_total{namespace="starfleet",container="scout",status=~"5xx"}[5m])) / sum(rate(http_requests_total{namespace="starfleet",container="scout"}[5m]))
        - record: scout:error_ratio:rate1h
          expr: sum(rate(http_requests_total{namespace="starfleet",container="scout",status=~"5xx"}[1h])) / sum(rate(http_requests_total{namespace="starfleet",container="scout"}[1h]))
        - alert: ScoutErrorBudgetBurn
          expr: scout:error_ratio:rate5m / (1 - 0.99) > 2 and scout:error_ratio:rate1h / (1 - 0.99) > 2
          for: 2m
          labels:
            severity: ticket
            service: scout
          annotations:
            summary: scout spends its 30-day error budget more than twice as fast as the SLO allows
