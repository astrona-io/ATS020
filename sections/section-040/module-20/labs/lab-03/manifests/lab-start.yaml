apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
      - name: scout
        image: ghcr.io/stefanprodan/podinfo:6.17.0
        ports:
        - name: http
          containerPort: 9898
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  selector:
    app: scout
  ports:
  - name: http
    port: 9898
    targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scout
  namespace: starfleet
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: scout
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: mccutchen/go-httpbin:2.25.0
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /status/200
            port: http
        resources:
          requests:
            cpu: 1m
            memory: 2Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shuttle-traffic
  namespace: starfleet
data:
  traffic.sh: |
    #!/bin/sh
    # One round sends 19 normal requests and one request to /status/500 to
    # scout (5% errors), and 10 requests to probe. curl reuses the connection
    # for the URLs of one round. Every URL needs its own "-o /dev/null".
    SCOUT=http://scout.starfleet:9898
    PROBE=http://probe.starfleet:8080
    URLS=""
    for i in $(seq 1 19); do URLS="$URLS -o /dev/null $SCOUT/"; done
    URLS="$URLS -o /dev/null $SCOUT/status/500"
    for i in $(seq 1 10); do URLS="$URLS -o /dev/null $PROBE/get"; done
    while true; do
      curl -s --max-time 10 $URLS
      sleep 0.5
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
      - name: shuttle
        image: curlimages/curl:8.23.0
        command:
        - sh
        - /traffic/traffic.sh
        volumeMounts:
        - name: traffic
          mountPath: /traffic
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
      volumes:
      - name: traffic
        configMap:
          name: shuttle-traffic
