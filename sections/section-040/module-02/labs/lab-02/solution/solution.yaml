# Reference end state for scout and probe. Applied by `astrona test` only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
spec:
  template:
    spec:
      containers:
        - name: scout
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  template:
    spec:
      containers:
        - name: probe
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {memory: 128Mi}
